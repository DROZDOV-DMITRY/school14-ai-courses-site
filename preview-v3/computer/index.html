<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdf8"><title>Компьютер · Курс ИИ</title>
<link rel="stylesheet" href="../assets/s14-v2.css">
<script defer src="../assets/alice-helper.js"></script>
</head><body class="has-alice">
<header class="topbar"><div class="wrap inner"><a class="brand" href="../"><b>КУРС ИИ</b> · Компьютер</a><nav class="topnav"><a href="../">Главная</a><a href="#more">Ещё</a></nav></div></header>
<main>
<section class="student-hero"><div class="wrap"><h1>Что не получается?</h1><p>Выбери место. Дальше — один шаг.</p></div></section>

<section class="section light"><div class="wrap help-shell">
<div class="choice-row" id="categories">
<button class="choice-btn" data-cat="browser"><span>🌐</span>Браузер</button>
<button class="choice-btn" data-cat="files"><span>📁</span>Файлы</button>
<button class="choice-btn" data-cat="login"><span>🔐</span>Аккаунт</button>
<button class="choice-btn" data-cat="keys"><span>⌨️</span>Клавиатура</button>
</div>
<div class="subchoices" id="subchoices" aria-live="polite"></div>
<article class="answer" id="answer" aria-live="polite">
<h3 id="answerTitle"></h3><p id="stepText" style="font-size:1.18rem;font-weight:850"></p>
<div class="keyboard-shot" id="keyboardShot" hidden><img src="https://rudiskont.ru/upload/iblock/d41/aeef8vn0aueukibmlx1v0ocu5v98lb5n.jpg" alt="Клавиатура DEXP" loading="lazy"><div id="markers"></div></div>
<div class="actions"><button class="action" id="nextStep" type="button">Дальше →</button><button class="action secondary" id="backToTopics" type="button">Назад</button></div>
<p class="micro-note" id="progress"></p>
</article>
</div></section>

<section class="section soft" id="more"><div class="wrap"><h2 class="action-title">Ещё</h2>
<div class="quick-links">
<a href="../skills/input/"><span>🎙 Говорить вместо печати</span><span>→</span></a>
<a href="../hotkeys/"><span>⌨️ Горячие клавиши</span><span>→</span></a>
<a href="../tools/yandex-mail/"><span>✉️ Завести почту</span><span>→</span></a>
<a href="https://typelesson.com/" target="_blank" rel="noopener"><span>⚡ Печатать быстрее</span><span>↗</span></a>
</div></div></section>

<section class="section light"><div class="wrap"><div class="safety">Пароль и код подтверждения никому не отправляй.</div></div></section>
</main>
<button class="alice-fab" type="button" data-alice-helper>✦ Спросить Алису</button>
<footer class="footer"><div class="wrap"><a href="../">← Главная</a></div></footer>

<script>
(() => {
  const kb={WIN:[31,68,"Win"],SHIFT:[21,60,"Shift"],S:[34,58,"S"],E:[35,51,"E"],CTRL:[19,68,"Ctrl"],C:[39,63,"C"],V:[43,63,"V"],ALT:[37,68,"Alt"],TAB:[20,49,"Tab"]};
  const data={
    browser:{items:[
      {t:"Новая вкладка",s:[{x:"Нажми Ctrl + T.",k:["CTRL"]},{x:"Введи адрес сверху → Enter."}]},
      {t:"Другая вкладка",s:[{x:"Нажми Ctrl + Tab.",k:["CTRL","TAB"]}]},
      {t:"Вернуться назад",s:[{x:"Нажми ← слева сверху."}]}
    ]},
    files:{items:[
      {t:"Создать папку",s:[{x:"Нажми Win + E.",k:["WIN","E"]},{x:"Открой «Рабочий стол»."},{x:"Правая кнопка → Создать → Папку."}]},
      {t:"Найти скачанное",s:[{x:"Нажми Win + E.",k:["WIN","E"]},{x:"Слева открой «Загрузки»."}]},
      {t:"Загрузить файл",s:[{x:"Нажми «Загрузить», «Прикрепить» или +."},{x:"Выбери файл → Открыть."}]}
    ]},
    login:{items:[
      {t:"Не помню пароль",s:[{x:"Нажми «Не помню пароль»."},{x:"Следуй восстановлению аккаунта."}]},
      {t:"Не пришёл код",s:[{x:"Обнови «Входящие»."},{x:"Проверь «Спам»."}]},
      {t:"Нет почты",s:[{x:"Открой «Завести почту» ниже."}]}
    ]},
    keys:{items:[
      {t:"Копировать / вставить",s:[{x:"Копировать: Ctrl + C.",k:["CTRL","C"]},{x:"Вставить: Ctrl + V.",k:["CTRL","V"]}]},
      {t:"Скрин → в ИИ",s:[{x:"Нажми Win + Shift + S.",k:["WIN","SHIFT","S"]},{x:"Выдели нужное место."},{x:"Вернись в чат."},{x:"Нажми Ctrl + V.",k:["CTRL","V"]},{x:"Напиши: «Что здесь нажать?»"}]},
      {t:"Переключить окно",s:[{x:"Нажми Alt + Tab.",k:["ALT","TAB"]}]}
    ]}
  };
  const subs=document.getElementById("subchoices"),ans=document.getElementById("answer"),title=document.getElementById("answerTitle"),txt=document.getElementById("stepText"),shot=document.getElementById("keyboardShot"),markers=document.getElementById("markers"),next=document.getElementById("nextStep"),progress=document.getElementById("progress");
  let current=null,step=0;
  function mark(keys=[]){markers.innerHTML="";shot.hidden=!keys.length;keys.forEach(n=>{const p=kb[n];if(!p)return;const m=document.createElement("span");m.className="key-marker";m.style.left=p[0]+"%";m.style.top=p[1]+"%";m.dataset.label=p[2];markers.appendChild(m)})}
  function render(){const s=current.s[step];txt.textContent=s.x;mark(s.k||[]);progress.textContent=(step+1)+" / "+current.s.length;next.textContent=step===current.s.length-1?"Готово ✓":"Дальше →"}
  document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{const d=data[b.dataset.cat];subs.innerHTML=d.items.map((it,i)=>'<button class="subchoice" type="button" data-i="'+i+'">'+it.t+'</button>').join("");subs.classList.add("show");ans.classList.remove("show");subs.querySelectorAll("[data-i]").forEach(x=>x.addEventListener("click",()=>{current=d.items[+x.dataset.i];step=0;title.textContent=current.t;ans.classList.add("show");render();ans.scrollIntoView({behavior:"smooth",block:"center"})}));subs.scrollIntoView({behavior:"smooth",block:"center"})}));
  next.addEventListener("click",()=>{if(step<current.s.length-1){step++;render()}else{ans.classList.remove("show");subs.scrollIntoView({behavior:"smooth",block:"center"})}});
  document.getElementById("backToTopics").addEventListener("click",()=>{ans.classList.remove("show");subs.scrollIntoView({behavior:"smooth",block:"center"})});
})();
</script>
</body></html>
