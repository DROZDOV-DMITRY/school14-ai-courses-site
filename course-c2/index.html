<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ИИ: агентный режим</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#5d6977;--accent:#6d46d9;--line:#dce3ee;--soft:#f1eaff;--max:980px;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.58}
.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}.top{padding:34px 0 18px}a{color:var(--accent)}
.back{text-decoration:none;font-weight:750}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,40px);margin:0 0 16px}
.hero{background:linear-gradient(135deg,#fff,#f1eaff)}h1{font-size:clamp(2.1rem,6vw,4.3rem);line-height:1.03;margin:.1em 0 .28em}
h2{font-size:clamp(1.35rem,3vw,2rem);margin:0 0 10px}.lead,.meta{color:var(--muted)}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--soft);font-size:.86rem;font-weight:800}
.footer{color:var(--muted);font-size:.9rem;padding:24px 0 50px}
@media(max-width:760px){.wrap{width:min(calc(100% - 20px),var(--max))}.hero,.card{border-radius:14px}}
</style>
</head>
<body>
<main class="wrap">
<section class="top"><a class="back" href="../">← Все курсы</a></section>
<section class="hero">
<span class="badge">Курс 2</span>
<h1>ИИ: агентный режим</h1>
<p class="lead">Курс о переходе от отдельных запросов к управляемым процессам, инструментам, состояниям и агентным сценариям.</p>
</section>
<section class="card">
<h2>Материалы курса</h2>
<p class="meta">Раздел создан. Учебные занятия будут добавляться сюда по мере подготовки и проверки.</p>
</section>
<footer class="footer">Курс «ИИ: агентный режим»</footer>
</main>
</body>
</html>
